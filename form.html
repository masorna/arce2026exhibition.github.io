<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.A.S Ornata — Enquiry Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340..500;1,9..144,400..500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: '#395638',
          'brand-deep': '#26362A',
          'brand-soft': '#6C8368',
          paper: '#FAF9F6',
        },
        fontFamily: {
          sans: ['Jost', 'sans-serif'],
          serif: ['Fraunces', 'serif'],
        },
      },
    },
  };
</script>
</head>
<body class="bg-paper text-brand-deep font-sans antialiased min-h-screen">

<section class="min-h-screen flex items-start justify-center px-4 sm:px-6 pt-6 sm:pt-16 md:pt-20 pb-16 sm:pb-24">
  <div class="w-full max-w-xl bg-white border border-brand/10 rounded p-5 sm:p-12">

    <a href="index.html" class="inline-flex items-center gap-2 text-sm text-brand-deep/60 hover:text-brand transition">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back
    </a>

    <h1 class="font-serif font-normal text-2xl sm:text-4xl mt-6 mb-2">Kindly complete this form</h1>
    <p class="text-brand-deep/60 text-sm sm:text-base mb-10 max-w-md leading-relaxed">
      Share a few details with us.
    </p>

    <form id="enquiryForm">
      <input type="hidden" name="access_key" value="7101fa11-78c9-4f7d-86ff-a84eadc6f768">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-5">
        <div class="mb-6">
          <label for="title" class="block text-xs text-brand-deep/60 mb-2">Title</label>
          <select id="title" required
                  class="w-full bg-transparent border-0 border-b border-brand/15 focus:border-brand focus:outline-none py-2 text-sm">
            <option value="" disabled selected>Select</option>
            <option>Mr</option>
            <option>Mrs</option>
            <option>Ms</option>
            <option>Dr</option>
            <option>Other</option>
          </select>
        </div>
        <div></div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-5">
        <div class="mb-6">
          <label for="firstName" class="block text-xs text-brand-deep/60 mb-2">First name</label>
          <input type="text" id="firstName" required
                 class="w-full bg-transparent border-0 border-b border-brand/15 focus:border-brand focus:outline-none py-2 text-sm">
        </div>
        <div class="mb-6">
          <label for="lastName" class="block text-xs text-brand-deep/60 mb-2">Last name</label>
          <input type="text" id="lastName" required
                 class="w-full bg-transparent border-0 border-b border-brand/15 focus:border-brand focus:outline-none py-2 text-sm">
        </div>
      </div>

      <div class="mb-6">
        <label for="organization" class="block text-xs text-brand-deep/60 mb-2">Organisation</label>
        <input type="text" id="organization" required
               class="w-full bg-transparent border-0 border-b border-brand/15 focus:border-brand focus:outline-none py-2 text-sm placeholder:text-brand-deep/30">
      </div>

      <div class="mb-6">
        <label for="email" class="block text-xs text-brand-deep/60 mb-2">Email</label>
        <input type="email" id="email" required
               class="w-full bg-transparent border-0 border-b border-brand/15 focus:border-brand focus:outline-none py-2 text-sm">
      </div>

      <div class="mb-2">
        <p class="text-xs text-brand-deep/60 mb-3">Tap all that interest you</p>
        <div id="interestOptions" class="flex flex-wrap gap-2.5 mb-2">
          <button type="button" data-value="Table top compositions"
                  class="interest-pill border border-brand/15 bg-white text-brand-deep text-sm px-4 py-2 rounded-full hover:border-brand-soft transition">
            Table top compositions
          </button>
          <button type="button" data-value="Structural tree"
                  class="interest-pill border border-brand/15 bg-white text-brand-deep text-sm px-4 py-2 rounded-full hover:border-brand-soft transition">
            Structural tree
          </button>
          <button type="button" data-value="Orchid/ Floral arrangement"
                  class="interest-pill border border-brand/15 bg-white text-brand-deep text-sm px-4 py-2 rounded-full hover:border-brand-soft transition">
            Orchid/ Floral arrangement
          </button>
          <button type="button" data-value="Premium Green Botanicals"
                  class="interest-pill border border-brand/15 bg-white text-brand-deep text-sm px-4 py-2 rounded-full hover:border-brand-soft transition">
            Premium Green Botanicals
          </button>
              <button type="button" data-value="Bespoke Commission"
              class="interest-pill border border-brand/15 bg-white text-brand-deep text-sm px-4 py-2 rounded-full hover:border-brand-soft transition">
            Bespoke Commission
              </button>
          <button type="button" data-value="Other"
                  class="interest-pill border border-brand/15 bg-white text-brand-deep text-sm px-4 py-2 rounded-full hover:border-brand-soft transition">
            Other
          </button>
        </div>
        <div id="othersField" class="hidden mt-2">
          <textarea id="othersText" placeholder="Tell us what you have in mind" rows="3"
                    class="w-full bg-transparent border-0 border-b border-brand/15 focus:border-brand focus:outline-none py-2 text-sm resize-y placeholder:text-brand-deep/30"></textarea>
        </div>
      </div>

      <div class="mt-9 flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-5">
        <button type="submit" id="submitBtn"
                class="w-full sm:w-auto bg-brand-deep text-white text-sm px-9 py-3.5 rounded-full hover:bg-brand transition disabled:opacity-60 disabled:cursor-default">
          Submit
        </button>
        <span id="formNote" class="text-xs sm:text-sm"></span>
      </div>
    </form>
  </div>
</section>

<script>
  const pillSelectedClasses = ['bg-brand-deep', 'border-brand-deep', 'text-white'];
  const pillDefaultClasses = ['bg-white', 'text-brand-deep', 'border-brand/15'];

  const interestOptions = document.getElementById('interestOptions');
  const othersField = document.getElementById('othersField');
  let selectedInterests = [];

  interestOptions.addEventListener('click', (e) => {
    const btn = e.target.closest('.interest-pill');
    if (!btn) return;

    const interest = btn.dataset.value;
    const isSelected = selectedInterests.includes(interest);

    if (isSelected) {
      selectedInterests = selectedInterests.filter(value => value !== interest);
      btn.classList.remove(...pillSelectedClasses);
      btn.classList.add(...pillDefaultClasses);
    } else {
      selectedInterests.push(interest);
      btn.classList.remove(...pillDefaultClasses);
      btn.classList.add(...pillSelectedClasses);
    }

    othersField.classList.toggle('hidden', !selectedInterests.includes('Other'));
  });
  

  const form = document.getElementById('enquiryForm');
  const formNote = document.getElementById('formNote');
  const submitBtn = document.getElementById('submitBtn');

  function setNote(text, type) {
    formNote.textContent = text;
    formNote.className = 'text-xs sm:text-sm ' + (type === 'error' ? 'text-red-700' : type === 'success' ? 'text-brand' : 'text-brand-deep/60');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    setNote('', '');

    if (selectedInterests.length < 1) {
      setNote('Please choose at least one interest.', 'error');
      return;
    }
    if (selectedInterests.includes('Other') && !document.getElementById('othersText').value.trim()) {
      setNote('Please tell us a little about what you have in mind.', 'error');
      return;
    }

    const fullName = [document.getElementById('title').value, document.getElementById('firstName').value.trim(), document.getElementById('lastName').value.trim()]
      .filter(Boolean).join(' ');
    const entry = {
      title: document.getElementById('title').value,
      firstName: document.getElementById('firstName').value.trim(),
      lastName: document.getElementById('lastName').value.trim(),
      organisation: document.getElementById('organization').value.trim(),
      email: document.getElementById('email').value.trim(),
      interest: selectedInterests.join(', '),
      othersText: selectedInterests.includes('Other') ? document.getElementById('othersText').value.trim() : ''
    };

    const message = entry.othersText ? 'Details: ' + entry.othersText : '';

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    try {
      const payload = new FormData();
      payload.append('access_key', document.querySelector('input[name="access_key"]').value);
      payload.append('subject', 'ARCE 2026 Exhibition form submitted from ' + fullName);
      payload.append('name', fullName);
      payload.append('email', entry.email);
      payload.append('organisation', entry.organisation);
      payload.append('interest', entry.interest);
      if (message) payload.append('message', message);
      

      const response = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: payload
      });
      const result = await response.json();

      if (!result.success) {
        throw new Error(result.message || 'Submission failed.');
      }

      const thanksUrl = 'thanks.html'
        + '?title=' + encodeURIComponent(entry.title)
        + '&first=' + encodeURIComponent(entry.firstName);
      window.location.href = thanksUrl;
    } catch (err) {
      console.error(err);
      setNote('Something went wrong sending your enquiry. Please try again.', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit';
    }
  });
</script>

</body>
</html>
